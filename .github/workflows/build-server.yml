name: Build Go Server Binaries

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    name: Build Go Server (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            output: claude-remote-server-windows-amd64.exe
          - os: linux
            arch: amd64
            output: claude-remote-server-linux-amd64
          - os: darwin
            arch: arm64
            output: claude-remote-server-darwin-arm64
          - os: darwin
            arch: amd64
            output: claude-remote-server-darwin-amd64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build Go Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o bin/${{ matrix.output }} ./cmd/server

      - name: Upload Server Binary
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/${{ matrix.output }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: bin/${{ matrix.output }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # M7: publish the root Dockerfile (the cmd/relay hub) as a PUBLIC ghcr.io
  # image so the Railway template can reference a Docker-image source instead
  # of this GitHub repo — repo-source templates show "Trying to access GitHub
  # repository" (Deploy disabled) for anyone but the owner.
  publish-relay-image:
    name: Publish relay image to GHCR
    runs-on: ubuntu-latest
    # Push triggers only (main/master branch pushes + v* tags): publishing
    # needs packages-write GITHUB_TOKEN, which pull_request events lack.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # :latest always; :main (or :master) on branch pushes; :vX.Y.Z on
          # tag pushes (github.ref_name carries both cases).
          tags: |
            ghcr.io/${{ github.repository_owner }}/claude-remote-relay:latest
            ghcr.io/${{ github.repository_owner }}/claude-remote-relay:${{ github.ref_name }}
