name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies & Build Frontend
        working-directory: mobile
        run: |
          npm ci || npm install
          npm run build

      - name: Copy Web Dist to Android Assets
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp -r mobile/dist/* mobile/android/app/src/main/assets/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Android APK with Gradle
        working-directory: mobile/android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          find mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} release-apk/claude-remote.apk \;

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-remote-android-apk
          path: release-apk/claude-remote.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/claude-remote.apk
          name: Claude Remote ${{ github.ref_name }} — Remote Control (approvals, questions, live process view)
          body: |
            ## 📱 Claude Code Remote — ${{ github.ref_name }}

            Monitor **and control** Claude Code from your phone. This release turns the
            monitor into a remote control surface: watch every step Claude executes, and
            answer its questions and permission requests directly from your phone.

            ### ✨ What's New

            **Watch**
            - **Live Process view** — every agent step as it happens: your prompts, Claude's
              thinking, tool calls with full detail (commands, file edits), and results.
              Long outputs scroll inside fixed-height boxes, so the view stays stable.
            - **Activity log controls** — clear the log with one tap, or auto-drop entries
              older than 5 / 15 / 30 minutes.

            **Control**
            - **Remote approvals** — permission requests appear on your phone with
              Allow / Deny / "always allow" and an optional note for Claude. If you don't
              answer in time, the request falls back to the normal PC terminal prompt —
              Claude Code is never blocked.
            - **Question answering** — Claude's multiple-choice questions arrive as tappable
              options (multi-select + free-text notes); plan reviews show the full plan
              with Approve / Reject.
            - **Mid-task prompts** — queue a follow-up while Claude is still working; it's
              delivered the moment the current turn ends (same semantics as the official
              Remote Control).
            - **Permission rules editor** — view and edit Claude Code's permission mode and
              allow / ask / deny rules from the phone. Uses Claude Code's own rule syntax;
              your other settings are preserved.

            ### 🔄 How to update

            1. Replace the desktop server binary with the new build and restart it — the
               decision hooks are installed automatically on startup.
            2. Install this APK over your existing app.
            3. Start a **fresh** Claude Code session (already-running sessions keep the
               hooks they started with).

            ### 📦 Downloads (this release)

            | File | What it is |
            | --- | --- |
            | `claude-remote.apk` | The Android app |
            | `claude-remote-server-windows-amd64.exe` | Desktop server for Windows (the main download) |
            | `claude-remote-server-linux-amd64` | Desktop server for Linux |
            | `claude-remote-server-darwin-arm64` | Desktop server for macOS (Apple Silicon) |
            | `claude-remote-server-darwin-amd64` | Desktop server for macOS (Intel) |

            Run the server for your OS (Windows: double-click or run in a terminal —
            Linux/macOS: `chmod +x` first). On first start it prints its LAN URL and a
            QR code to scan from the app. Build from source instead with
            `go build ./cmd/server`.

            ### 🛡 Safety

            - Every wait has a timeout — an unreachable phone falls back to the PC terminal.
            - `bypassPermissions` mode is unchanged: nothing is parked, nothing is bypassed.
            - All control commands ride the same token-authenticated connection as the
              status stream; the relay path requires encrypted `wss://`.

            ### ⚠ Known limitations

            - Prompts queued while the session is fully idle are delivered at the next
              turn's end (an idle session has no hook to carry an injection).
            - In `auto` / `dontAsk` permission modes the banner reacts only to the events
              Claude Code emits in those modes.

            **Full changelog**: compare [`e3a714d...${{ github.ref_name }}`](https://github.com/alipbudiman/claude-code-remote/compare/e3a714d...${{ github.ref_name }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
